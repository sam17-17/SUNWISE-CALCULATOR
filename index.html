
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunwise - Solar Power Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #ffffff; margin: 0; }
        #root { min-height: 100vh; }
        ::selection { background-color: #06b6d4; color: #ffffff; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }

        #error-overlay {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            background: #450a0a;
            color: #fca5a5;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #7f1d1d;
            font-family: monospace;
            z-index: 9999;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        @media print {
            body { background: white !important; color: black !important; }
            aside, header, footer, button, .no-print { display: none !important; }
            main { padding: 0 !important; max-width: 100% !important; margin: 0 !important; }
            .bg-slate-900\/40, .bg-slate-950, .bg-slate-900 { background: white !important; border: 1px solid #eee !important; box-shadow: none !important; color: black !important; }
            .text-white { color: black !important; }
            .text-cyan-400, .text-cyan-500 { color: #0284c7 !important; font-weight: bold !important; }
        }
    </style>
    <script>
        // Polyfill process for Gemini SDK and other ESM modules
        window.process = window.process || { env: { API_KEY: "" } };
        
        // Error logging for "Blank Screen" debugging
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            const overlay = document.getElementById('error-overlay');
            if (overlay) {
                overlay.style.display = 'block';
                overlay.innerHTML = `<strong>Runtime Error:</strong><br>${msg}<br><small>${url}:${lineNo}</small>`;
            }
            return false;
        };
    </script>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "recharts": "https://esm.sh/recharts@2.12.7",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body class="bg-slate-950 text-white">
    <div id="error-overlay"></div>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
