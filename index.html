
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunwise - Solar Power Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #ffffff; }
        ::selection {
            background-color: #06b6d4;
            color: #ffffff;
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }

        @media print {
            body { background: white !important; color: black !important; }
            aside, header, footer, button, .no-print { display: none !important; }
            main { padding: 0 !important; max-width: 100% !important; margin: 0 !important; }
            .lg\:col-span-8, .xl\:col-span-9 { width: 100% !important; grid-column: span 12 / span 12 !important; }
            .bg-slate-900\/40, .bg-slate-950, .bg-slate-900 { background: white !important; border: 1px solid #eee !important; box-shadow: none !important; color: black !important; }
            .text-white { color: black !important; }
            .text-slate-500, .text-slate-400 { color: #666 !important; }
            .bg-gradient-to-br { background: #f8fafc !important; border: 1px solid #ddd !important; color: black !important; }
            .rounded-\[2rem\], .rounded-\[2\.5rem\] { border-radius: 8px !important; }
            svg { filter: grayscale(1); }
            .text-cyan-400, .text-cyan-500 { color: #0284c7 !important; font-weight: bold !important; }
        }
    </style>
